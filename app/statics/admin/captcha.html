<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zcode2api-plus · 人机验证</title>
  <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
  <link href="/static/css/app.css?v={{APP_VERSION}}" rel="stylesheet">
</head>
<body>
<div id="admin-header" data-active="/admin/captcha"></div>

<main class="admin-main">
  <div class="page-hd">
    <div>
      <div class="page-title">人机验证</div>
      <div class="page-sub">自动求解被风控拦截时，在真实浏览器手动完成阿里云无痕验证，结果供 JWT 账号请求复用</div>
    </div>
  </div>

  <div class="table-card" style="max-width:640px;padding:24px">
    <div class="dialog-help" id="cap-status">正在加载验证配置…</div>
    <div id="cap" style="margin:16px 0"></div>
    <button id="btn" class="dialog-btn dialog-btn-primary w-full" style="height:40px">开始验证</button>
    <div class="dialog-help" id="cap-hint" style="margin-top:14px"></div>
  </div>
</main>

<script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
<script src="/static/js/auth.js?v={{APP_VERSION}}"></script>
<script src="/static/js/toast.js?v={{APP_VERSION}}"></script>
<script src="/static/js/header.js?v={{APP_VERSION}}"></script>
<script>
(async()=>{
  await renderAdminHeader();
  const key=await adminKey.get();
  if(!key||!await verifyKey(ADMIN_API+'/verify',key).catch(()=>false))return location.href='/admin/login';
  const status=document.getElementById('cap-status');
  const hint=document.getElementById('cap-hint');
  if(typeof window.initAliyunCaptcha!=='function'){
    status.textContent='阿里云验证 SDK 加载失败，请检查网络后刷新页面。';
    return;
  }
  let cfg;
  try{
    cfg=await api('GET','/captcha/config');
  }catch(e){
    status.textContent='加载验证配置失败: '+e.message;
    return;
  }
  status.textContent=`验证配置：scene=${cfg.sceneId||'-'} · region=${cfg.region||'-'} · ${cfg.enabled?'已启用':'未启用'}`;
  hint.textContent='点击「开始验证」，将在真实浏览器中完成验证；如果出现滑块，请在弹窗中手动完成。';
  let started=false, attempts=0;
  document.getElementById('btn').addEventListener('click',()=>{
    if(started)return;
    started=true; attempts=0;
    hint.textContent='无痕验证进行中：通常数秒内自动完成，期间不会出现弹窗；仅当风控要求二次验证时才会弹出滑块，请在弹窗中手动完成。';
    window.initAliyunCaptcha({
      SceneId:cfg.sceneId, mode:'popup', region:cfg.region, prefix:cfg.prefix,
      element:'#cap', button:'#btn', captchaLogoImg:'', showErrorTip:false,
      getInstance:(inst)=>{
        // SDK 验证失败后会销毁重建实例，并以 undefined 回调本函数；
        // 若不防护，这里会对 undefined 调方法抛 TypeError，导致 started 状态错乱、弹窗反复闪现。
        if(!inst)return;
        if(attempts>=3){
          showToast('多次重试仍未通过，请稍后再点「开始验证」','error');
          hint.textContent='验证多次未通过。可稍后重试；若持续失败，请检查网络或更换出口 IP。';
          started=false;
          return;
        }
        attempts++;
        try{ (inst.startTracelessVerification||inst.show).call(inst); }
        catch(e){ showToast('启动验证失败: '+e.message,'error'); started=false; }
      },
      success:async(param)=>{
        try{
          await api('POST','/captcha/submit',{verify_param:param});
          showToast('验证结果已提交，约 45 秒内供 JWT 请求使用','success');
          hint.textContent='已提交。验证码是短期结果，过期后请重新完成验证。';
        }catch(e){ showToast('提交失败: '+e.message,'error'); hint.textContent='验证已通过但提交失败，请重新点击「开始验证」。'; }
        started=false;
      },
      fail:(err)=>{ showToast('验证失败: '+((err&&err.message)||JSON.stringify(err)||'unknown'),'error'); hint.textContent='验证未通过，SDK 会自动重试；若长时间无结果，可再次点击「开始验证」。'; started=false; },
      onError:(err)=>{ showToast('验证初始化失败: '+((err&&err.message)||'unknown'),'error'); started=false; },
    });
  });
})();
</script>
</body>
</html>
